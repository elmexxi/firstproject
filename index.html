<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello World</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--text);
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 48px 56px;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 4rem);
        color: var(--primary);
        letter-spacing: 0.04em;
      }

      p {
        margin-top: 16px;
        margin-bottom: 0;
        font-size: 1.1rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Hello World!</h1>
      <p>Willkommen zu meinem ersten Projekt.</p>
    </main>
  </body>
</html>
