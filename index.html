<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Pickleball</title>
<style>
:root{
  --bg:#0d1a2b; --card:#15273d; --card2:#1b3250; --line:#26405f;
  --text:#f3f7fb; --muted:#9db3cc; --lime:#c6f135; --orange:#ff7a2f;
  --disp:"Arial Narrow","Roboto Condensed","Segoe UI",system-ui,sans-serif;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);line-height:1.45;
  background-image:radial-gradient(circle at 85% -10%,rgba(198,241,53,.14),transparent 45%),radial-gradient(circle at -10% 20%,rgba(255,122,47,.10),transparent 40%);
  min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{padding:12px 0 14px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.ball{width:16px;height:16px;border-radius:50%;background:var(--lime);position:relative;display:inline-block}
.ball:before{content:"";position:absolute;inset:0;border-radius:50%;background:
  radial-gradient(circle at 30% 35%,var(--bg) 0 1.3px,transparent 1.6px),
  radial-gradient(circle at 68% 30%,var(--bg) 0 1.3px,transparent 1.6px),
  radial-gradient(circle at 50% 68%,var(--bg) 0 1.3px,transparent 1.6px)}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(38px,9vw,64px);line-height:1;margin:8px 0 6px;text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--lime)}
.sub{color:var(--muted);font-size:15px}

.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:6px 0 4px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.slabel{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
[hidden]{display:none!important}
.genrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.gen{background:var(--lime);color:#0d1a2b;border:0;border-radius:999px;padding:12px 22px;font:700 16px var(--ui);cursor:pointer}
.gen:active{transform:scale(.98)}
.msg{font-size:13.5px;color:var(--muted)}
.msg.err{color:var(--orange)}
.empty{border:1px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted);font-size:15px;margin-top:14px}
.empty b{display:block;font-family:var(--disp);font-size:26px;color:var(--text);margin-bottom:4px;text-transform:uppercase}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:640px){.names{grid-template-columns:repeat(3,minmax(0,1fr))}}
.nm{min-width:0;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.nm:focus-within{border-color:var(--lime)}
.nm .av{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0d1a2b}
.nm input{flex:1;width:100%;min-width:0;background:none;border:0;outline:0;color:var(--text);font:500 15px var(--ui);padding:4px 0}
.nm input::placeholder{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--disp);font-size:34px;font-weight:700;color:var(--lime);line-height:1}
.stat small{color:var(--muted);font-size:12.5px}

.timer{position:sticky;top:8px;z-index:5;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.tdisp{font-family:var(--disp);font-weight:800;font-size:56px;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums;grid-row:span 2}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.tbtns button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:600 14px var(--ui);cursor:pointer}
.tbtns button.primary{background:var(--lime);color:#0d1a2b;border-color:var(--lime)}
.tbtns button:disabled{opacity:.4;cursor:default}
.tbar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--lime);transition:width .25s linear}
.timer.over{border-color:var(--orange);animation:flash .7s ease-in-out infinite alternate}
.timer.over .tdisp{color:var(--orange)}
.timer.over .tbar i{background:var(--orange)}
@keyframes flash{from{background:var(--card2)}to{background:#4a2a18}}
@media(max-width:420px){.tdisp{font-size:46px}}

.filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:600 14px var(--ui);cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed=true]{background:var(--lime);color:#0d1a2b;border-color:var(--lime)}
.info{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 14px;font-size:14px;display:none}
.info.on{display:block}
.info b{color:var(--lime)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.game{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;transition:opacity .2s,border-color .2s}
.game.dim{opacity:.38}
.game.done{border-color:var(--lime)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.num{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em}
.num small{color:var(--muted);font-size:13px;font-weight:600;margin-left:6px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--ui)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;cursor:pointer;font-size:15px;display:grid;place-items:center}
.done .check{background:var(--lime);border-color:var(--lime);color:#0d1a2b}
.court{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.team{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.vs{font-family:var(--disp);font-weight:800;color:var(--orange);font-size:18px}
.p{display:flex;align-items:center;gap:7px;border-radius:999px;padding:4px 10px 4px 4px;background:var(--card);font-weight:600;font-size:14px;min-width:0}
.p span.av{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0d1a2b}
.p em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p.hl{outline:2px solid var(--lime)}
.pause{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.pause .tag{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--orange)}
.pause .mini{display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:500}
.pause .mini span{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#0d1a2b}
.pause .mini.hl{outline:2px solid var(--orange);border-radius:999px;padding-right:6px}
.foot{margin-top:26px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.reset{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:500 13px var(--ui);cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge"><span class="ball"></span> Match schedule</div>
    <h1>Pickle<span>ball</span></h1>
    <p class="sub" id="sub"></p>
  </header>

  <section class="setup" aria-label="Enter players">
    <div class="srow"><span class="slabel">Players · enter 4 to 6 names</span></div>
    <div class="names" id="names"></div>
    <div class="genrow">
      <button class="gen" id="gen">Generate schedule</button>
      <span class="msg" id="msg" aria-live="polite"></span>
    </div>
  </section>

  <section class="timer" id="timer" aria-label="Timer">
    <div class="tdisp" id="tdisp" role="timer" aria-live="off">15:00</div>
    <div class="tbtns">
      <button class="primary" id="tstart">Start</button>
      <button id="tstop" disabled>Stop</button>
      <button id="treset">Reset</button>
    </div>
    <div class="tbar"><i id="tfill"></i></div>
  </section>

  <div class="empty" id="empty"><b>No schedule yet</b>Enter at least 4 names above and click “Generate schedule”.</div>

  <div id="plan" hidden>
  <section class="stats" aria-label="Fairness">
    <div class="stat"><b id="s-play"></b><small>Games per player</small></div>
    <div class="stat"><b id="s-pause"></b><small>Sit-outs per player</small></div>
    <div class="stat"><b id="s-team"></b><small>each pair as partners</small></div>
    <div class="stat"><b id="s-opp"></b><small>each pair as opponents</small></div>
  </section>

  <nav class="filter" id="filter" aria-label="Choose player"></nav>
  <div class="info" id="info"></div>
  <main class="grid" id="grid"></main>

  <div class="foot">
    <span>Tip: tick a game once it has been played.</span>
    <button class="reset" id="reset">Reset ticks</button>
  </div>
  </div>
</div>

<script>
const COLORS=["#c6f135","#4cc9f0","#ff7a2f","#ff4d8d","#ffd23f","#a98bff"];
// Ready-made fair rounds. Player indices are 1-based: [Team A, Team B]
const SCHEDULES={
  4:[[[1,2],[3,4]],[[1,3],[2,4]],[[1,4],[2,3]]],
  5:[[[2,5],[3,4]],[[1,3],[4,5]],[[2,4],[1,5]],[[3,5],[1,2]],[[1,4],[2,3]]],
  6:[[[3,6],[4,5]],[[5,6],[1,2]],[[1,4],[2,3]],[[4,6],[2,5]],[[3,6],[1,4]],
     [[3,5],[1,2]],[[1,6],[2,4]],[[2,6],[3,5]],[[1,3],[4,5]],[[2,6],[3,4]],
     [[5,6],[1,3]],[[2,4],[1,5]],[[1,6],[2,3]],[[2,5],[3,4]],[[4,6],[1,5]]]
};
const $=id=>document.getElementById(id);
let N=0, players=[], inputs=Array(6).fill(""), sel=0, done={}, GAMES=[], ALL=[];
try{
  const s=JSON.parse(localStorage.getItem("spielplan-v3")||"null");
  if(s){
    if(Array.isArray(s.inputs))inputs=Array.from({length:6},(_,i)=>typeof s.inputs[i]==="string"?s.inputs[i].slice(0,14):"");
    if(Array.isArray(s.players)&&s.players.length>=4&&s.players.length<=6&&s.players.every(x=>typeof x==="string")){players=s.players;N=players.length}
    if(s.done&&typeof s.done==="object")done=s.done;
  }
}catch(e){}
function save(){try{localStorage.setItem("spielplan-v3",JSON.stringify({inputs,players,done}))}catch(e){}}
function applyN(){GAMES=N?SCHEDULES[N]:[];ALL=Array.from({length:N},(_,i)=>i+1)}
applyN();

const name=i=>players[i-1];
const col=i=>COLORS[i-1];
const ini=i=>[...name(i)][0].toUpperCase();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=(i,hl)=>`<div class="p${hl?' hl':''}"><span class="av" style="background:${col(i)}">${esc(ini(i))}</span><em>${esc(name(i))}</em></div>`;
const mini=(i,hl)=>`<span class="mini${hl?' hl':''}"><span style="background:${col(i)}">${esc(ini(i))}</span>${esc(name(i))}</span>`;

// ---- Setup ----
const filled=()=>inputs.map(s=>s.trim()).filter(Boolean);
function setMsg(t,err){const m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}
function hint(){
  if(!N){setMsg("",false);return}
  const f=filled();
  const changed=f.length!==players.length||f.some((x,i)=>x!==players[i]);
  setMsg(changed?"Names changed – generate again to apply.":"",false);
}
function renderNames(){
  const el=$("names");
  el.innerHTML=inputs.map((v,i)=>`<label class="nm"><span class="av" style="background:var(--line);color:var(--text)">${i+1}</span><input type="text" maxlength="14" data-i="${i}" placeholder="Player ${i+1}" value="${esc(v)}" aria-label="Name of player ${i+1}"></label>`).join("");
  el.querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{inputs[+inp.dataset.i]=inp.value;save();hint()};
    inp.onkeydown=e=>{if(e.key==="Enter")generate()};
  });
}
function showPlan(){
  $("plan").hidden=!N;$("empty").hidden=!!N;
  if(!N)$("sub").textContent="Enter names and generate the schedule";
}
function generate(){
  const f=filled();
  if(f.length<4){setMsg("Please enter at least 4 names.",true);return}
  if(new Set(f.map(s=>s.toLowerCase())).size!==f.length){setMsg("Each name may only appear once.",true);return}
  players=f;N=f.length;sel=0;done={};applyN();save();setMsg("",false);showPlan();render();
}

// ---- Fairness figures, calculated directly from the schedule ----
function calcStats(){
  const pl={},pa={},op={};
  ALL.forEach(i=>{pl[i]=0});
  for(let a=1;a<=N;a++)for(let b=a+1;b<=N;b++){pa[a+"-"+b]=0;op[a+"-"+b]=0}
  const key=(x,y)=>Math.min(x,y)+"-"+Math.max(x,y);
  GAMES.forEach(([A,B])=>{
    [...A,...B].forEach(i=>pl[i]++);
    pa[key(...A)]++;pa[key(...B)]++;
    A.forEach(x=>B.forEach(y=>op[key(x,y)]++));
  });
  const rng=o=>{const v=Object.values(o);const lo=Math.min(...v),hi=Math.max(...v);return lo===hi?String(lo):lo+"–"+hi};
  return{play:rng(pl),pause:rng(Object.fromEntries(Object.entries(pl).map(([k,v])=>[k,GAMES.length-v]))),team:rng(pa),opp:rng(op)};
}
function renderStats(){
  const s=calcStats();
  document.getElementById("s-play").textContent=s.play;
  document.getElementById("s-pause").textContent=s.pause;
  document.getElementById("s-team").textContent=s.team+"×";
  document.getElementById("s-opp").textContent=s.opp+"×";
  const k=N-4;
  document.getElementById("sub").textContent=
    `${N} players · ${GAMES.length} games · `+(k?`${k} sitting out per game`:"everyone plays every game");
}

// ---- Display ----
function renderFilter(){
  const f=document.getElementById("filter");
  f.innerHTML=`<button class="chip" aria-pressed="${sel===0}" data-p="0">All</button>`+
   ALL.map(i=>`<button class="chip" aria-pressed="${sel===i}" data-p="${i}"><i style="background:${col(i)}"></i>${esc(name(i))}</button>`).join("");
  f.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{sel=+b.dataset.p;render()});
}
function renderInfo(){
  const el=document.getElementById("info");
  if(!sel){el.className="info";el.innerHTML="";return}
  const played=[],sat=[];
  GAMES.forEach(([a,b],k)=>{(a.includes(sel)||b.includes(sel)?played:sat).push(k+1)});
  el.className="info on";
  el.innerHTML=`<b>${esc(name(sel))}</b> `+(sat.length?`plays in games ${played.join(", ")} and sits out in ${sat.join(", ")}.`:`plays in all ${played.length} games.`);
}
function renderGrid(){
  document.getElementById("grid").innerHTML=GAMES.map(([a,b],k)=>{
    const pl=[...a,...b], pa=ALL.filter(x=>!pl.includes(x));
    const dim=sel&&!pl.includes(sel);
    return `<article class="game${dim?' dim':''}${done[k]?' done':''}">
      <div class="top"><div class="num">Game ${k+1}<small>${k+1} / ${GAMES.length}</small></div>
        <button class="check" data-k="${k}" aria-label="Game ${k+1} played">✓</button></div>
      <div class="court">
        <div class="team">${a.map(i=>pill(i,i===sel)).join("")}</div>
        <div class="vs">VS</div>
        <div class="team">${b.map(i=>pill(i,i===sel)).join("")}</div>
      </div>
      ${pa.length?`<div class="pause"><span class="tag">Sitting out</span>${pa.map(i=>mini(i,i===sel)).join("")}</div>`:""}
    </article>`}).join("");
  document.querySelectorAll(".check").forEach(b=>b.onclick=()=>{const k=b.dataset.k;done[k]=!done[k];save();renderGrid()});
}
function render(){renderStats();renderFilter();renderInfo();renderGrid()}
document.getElementById("reset").onclick=()=>{done={};save();renderGrid()};
$("gen").onclick=generate;
renderNames();showPlan();if(N){render();hint()}

// ---- Timer (15 minutes, timestamp-based, does not drift in a throttled tab) ----
const DUR=15*60*1000;
let remaining=DUR, endAt=0, iv=null, actx=null;
function beep(){
  try{
    if(!actx)return;
    [0,0.35,0.7].forEach(t=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=880;o.connect(g);g.connect(actx.destination);
      const s=actx.currentTime+t;
      g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.25);
      o.start(s);o.stop(s+0.3);
    });
  }catch(e){}
}
function showTimer(){
  const sec=Math.ceil(remaining/1000), m=String(Math.floor(sec/60)).padStart(2,"0"), s=String(sec%60).padStart(2,"0");
  $("tdisp").textContent=m+":"+s;
  $("tfill").style.width=(remaining/DUR*100)+"%";
  const running=iv!==null;
  $("tstart").disabled=running;
  $("tstop").disabled=!running;
  $("tstart").textContent=(!running&&remaining<DUR&&remaining>0)?"Resume":"Start";
}
function tick(){
  remaining=endAt-Date.now();
  if(remaining<=0){
    remaining=0;clearInterval(iv);iv=null;
    $("timer").classList.add("over");
    beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  }
  showTimer();
}
$("tstart").onclick=()=>{
  if(iv!==null)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  if(remaining<=0)remaining=DUR;
  $("timer").classList.remove("over");
  endAt=Date.now()+remaining;
  iv=setInterval(tick,250);
  showTimer();
};
$("tstop").onclick=()=>{
  if(iv===null)return;
  remaining=Math.max(0,endAt-Date.now());
  clearInterval(iv);iv=null;showTimer();
};
$("treset").onclick=()=>{
  clearInterval(iv);iv=null;remaining=DUR;
  $("timer").classList.remove("over");showTimer();
};
showTimer();
</script>
</body>
</html>
